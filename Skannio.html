<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skannio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/*
  Skannio — sistema visual
  Referência: a etiqueta térmica de envio (preto no branco, caixas de borda grossa, cantos arredondados de etiqueta)
  e o marca-texto lime passado no romaneio impresso. Lime só significa "conferido / ok" ou "você está aqui".
  Fonte: Atkinson Hyperlegible (Braille Institute), que separa 0/O e 1/I/l, o erro que importa ao ler um rastreio.
*/
:root{
  --bg:#E8E9E5; --card:#FFFFFF; --ink:#000000; --on-ink:#FFFFFF; --muted:#55574F;
  --line:#D2D3CD; --line2:#9C9E96; --soft:#F2F3F0;
  --lime:#CCFF00; --on-lime:#000000; --edge:#000000;
  --bad:#D2231B; --on-bad:#FFFFFF; --warn:#FFA400; --on-warn:#000000;
  --font:'Atkinson Hyperlegible Next',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Atkinson Hyperlegible Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r-lbl:12px; --r-ctl:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#161616; --ink:#F4F4F1; --on-ink:#000000; --muted:#A9AAA3;
  --line:#2D2E2A; --line2:#5C5E57; --soft:#202120; --edge:#F4F4F1;
  --bad:#FF5A4F; --on-bad:#000000; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#161616; --ink:#F4F4F1; --on-ink:#000000; --muted:#A9AAA3;
  --line:#2D2E2A; --line2:#5C5E57; --soft:#202120; --edge:#F4F4F1;
  --bad:#FF5A4F; --on-bad:#000000; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);margin:0;font-variant-numeric:tabular-nums}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--edge);outline-offset:2px}
.tv :focus-visible{outline-color:#CCFF00}
.disp{font-family:var(--font);font-weight:800;letter-spacing:-.018em;text-wrap:balance}
.sub{font-size:14px;font-weight:600;color:var(--muted)}
.hint{color:var(--muted);font-size:14px}
.mono{font-family:var(--mono)}

/* Marca-texto: a passada de caneta atrás do texto */
.mk{position:relative;isolation:isolate;color:var(--on-lime)}
.mk::before{content:"";position:absolute;inset:.08em -.32em .02em -.28em;background:var(--lime);z-index:-1;
  clip-path:polygon(1.5% 14%,40% 6%,99% 0,100% 82%,62% 92%,0 100%);transform:rotate(-1.2deg)}

/* Botões e campos */
.btn{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-ctl);padding:9px 15px;font-weight:600;font-size:15px;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.pri:hover{background:transparent;color:var(--ink)}
.btn.bad{background:var(--bad);color:var(--on-bad);border-color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.pri[disabled]:hover{background:var(--ink);color:var(--on-ink)}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:14px;font-weight:600}
.inp,.field input,.field select,.tools input,.tools select,textarea.csv,.addrow input{background:var(--card);border:1.5px solid var(--line2);border-radius:var(--r-ctl);padding:11px 12px;min-width:0;width:100%}
.inp:focus,.field input:focus,.field select:focus,.tools input:focus,textarea.csv:focus,.addrow input:focus{border-color:var(--ink)}
.err{background:var(--bad);color:var(--on-bad);padding:9px 12px;border-radius:var(--r-ctl);font-size:15px;font-weight:600}

/* Login: a marca, a etiqueta de acesso e a esteira do galpão */
.login{min-height:100vh;display:grid;grid-template-rows:1fr auto;overflow:hidden}
.lg-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,410px);gap:40px 64px;align-items:center;padding:44px clamp(20px,6vw,96px) 12px;max-width:1360px;width:100%;margin:0 auto}
.lg-brand .wm{font-weight:800;font-size:clamp(58px,8.4vw,128px);line-height:.8;letter-spacing:-.06em;margin-left:-.04em}
.lg-brand p{margin-top:26px;font-size:clamp(18px,1.7vw,23px);line-height:1.35;max-width:27ch}
.lg-brand small{display:block;margin-top:14px;font-size:14px;color:var(--muted);max-width:40ch}
.etq{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--r-lbl);overflow:hidden;min-width:0}
.etq-body{padding:24px 26px 26px}
.etq-foot{display:flex;align-items:center;gap:18px;padding:14px 26px;border-top:2.5px solid var(--ink)}
.etq-foot .lnote{font-size:13px;color:var(--muted)}
.code{flex:none;width:120px;height:40px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 6px,transparent 6px 9px,var(--ink) 9px 13px,transparent 13px 14px,var(--ink) 14px 15px,transparent 15px 19px)}
.lcard{display:grid;gap:18px}
.lcard h1{font-size:30px;letter-spacing:-.025em}
.lcard form{display:grid;gap:14px}
.pw{display:grid;grid-template-columns:1fr auto;gap:8px}
.pw2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.pw2{grid-template-columns:1fr}}
.esteira{height:300px;min-width:0}
.esteira>svg{display:block;width:100%;height:100%}
.esteira svg.astro{width:240px;height:223px}
.esteira .bx{fill:var(--card);stroke:var(--ink);stroke-width:3}
.esteira .sm{fill:none;stroke:var(--ink);stroke-width:1.5}
.esteira .tp{fill:var(--line)}
.esteira .lb{fill:#fff;stroke:var(--ink);stroke-width:1.5}
.esteira .lb.on{fill:#CCFF00}
.esteira .br{stroke:#000;stroke-linecap:butt}
.esteira .belt{fill:var(--ink)}
.esteira .dash{fill:none;stroke:var(--bg);stroke-width:3;stroke-dasharray:16 24;animation:dash .6s linear infinite}
.esteira .rol{fill:var(--card);stroke:var(--ink);stroke-width:3}
.esteira .leg{fill:var(--ink)}
.esteira .floor{stroke:var(--line2);stroke-width:2}
.esteira .beam{fill:#CCFF00;opacity:.42}
.esteira .scanl{stroke:#CCFF00;stroke-width:4}
.esteira .run{animation:run 18s linear infinite}
@keyframes run{from{transform:translateX(-1200px)}to{transform:translateX(0)}}
@keyframes dash{to{stroke-dashoffset:-40}}

/* App */
.shell{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.brand .hd{width:40px;flex:none}
.brand b{font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1}
.nav{display:grid;gap:1px}
.nav h6{margin:16px 10px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.nav h6:first-child{margin-top:0}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:0;border-radius:var(--r-ctl);color:var(--ink);padding:8px 10px;font-size:15px;text-align:left;width:100%}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{font-weight:700}
.nav svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"] svg{stroke:var(--ink)}
.sidefoot{margin-top:auto;padding:0 10px;color:var(--muted);font-size:13px}
.content{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 32px;border-bottom:1px solid var(--line)}
.bar .l{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px}
.bar .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)}
.pill.off i{background:var(--warn)}
.user{display:flex;align-items:center;gap:10px;margin-left:6px}
.user .av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.user b{display:block;font-size:14px;line-height:1.15}
.user small{color:var(--muted);font-size:12px}
.user button{background:transparent;border:0;text-align:left;padding:0;display:flex;gap:9px;align-items:center}
main{padding:28px 32px 56px;max-width:1200px;width:100%}
.ph{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.ph h1{font-size:clamp(28px,3.6vw,38px);line-height:1.05}
.subtabs{display:flex;gap:22px;border-bottom:1px solid var(--line2);margin-bottom:22px;overflow-x:auto}
.subtabs button{flex:none;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted);padding:8px 0 9px;font-weight:600;font-size:15px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.subtabs button:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lbl);padding:20px;display:grid;gap:12px;align-content:start;min-width:0}
.card.lbl{border:2.5px solid var(--ink);padding:0;gap:0;overflow:hidden}
.card.lbl>.cell{padding:18px 20px;display:grid;gap:12px}
.card.lbl>.cell+.cell,.card.lbl>.res{border-top:2.5px solid var(--ink)}
.card h3{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.banner{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;background:var(--card);border-left:4px solid var(--ink);padding:9px 14px;margin-bottom:22px;font-size:14px}

/* Bipagem */
.bip{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
.col{display:grid;gap:12px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:var(--r-ctl);overflow:hidden}
.seg button{background:var(--card);border:0;padding:10px 14px;text-align:left;display:grid;gap:1px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg b{font-weight:800;font-size:16px}
.seg span{font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.seg button.on span{color:var(--on-ink);opacity:.75}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.scan input{width:100%;font:600 clamp(20px,3.2vw,28px) var(--mono);padding:14px;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-ctl)}
.scan input::placeholder{font-family:var(--font);font-weight:400;font-size:18px;color:var(--muted)}
.res{padding:22px 20px;min-height:206px;display:grid;align-content:center;gap:6px;background:var(--soft);position:relative;padding-right:150px}
.res .t{font-weight:800;font-size:clamp(28px,4.2vw,44px);line-height:1;letter-spacing:-.03em}
.res .big{font-weight:800;font-size:clamp(19px,2.6vw,26px);line-height:1.2;margin-bottom:4px}
.res.ok{background:var(--lime);color:var(--on-lime)}
.res.warn{background:var(--warn);color:var(--on-warn)}
.res.bad{background:var(--bad);color:var(--on-bad)}
.res.idle .t{color:var(--muted);font-size:clamp(20px,2.8vw,26px);letter-spacing:-.01em}
.res.idle{color:var(--muted)}
.flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:40}
.flash.ok{background:var(--lime)}.flash.warn{background:var(--warn)}.flash.bad{background:var(--bad)}
.flash.go{animation:fl .4s ease-out}
@keyframes fl{0%{opacity:.5}100%{opacity:0}}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.try{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Dia: cada traço do código é um pedido */
.day{display:grid;gap:12px}
.day .big{font-size:18px;line-height:1.2}
.day .big b{font-size:44px;font-weight:800;letter-spacing:-.03em;margin-right:4px}
.meter{display:flex;gap:2px;height:46px;align-items:stretch}
.meter i{flex:1 1 0;min-width:1px;background:var(--line)}
.meter i.e1{background:var(--line2)}
.meter i.e2{background:var(--ink)}
.meter.tvm{height:88px;gap:3px}
.leg{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:4px 22px;margin:0;font-size:14px}
.leg div{display:grid;gap:0}
.leg dt{color:var(--muted);display:flex;align-items:center;gap:6px}
.leg dd{margin:0;font-weight:800;font-size:22px}
.sw{width:10px;height:10px;display:inline-block;background:var(--line)}
.sw.e1{background:var(--line2)}.sw.e2{background:var(--ink)}
.recent{list-style:none;margin:0;padding:0;display:grid}
.recent li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font-size:14px;padding:9px 0;border-top:1px solid var(--line)}
.recent .tm{color:var(--muted)}
.tag{font-size:13px;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap}
.tag.ok{background:var(--lime);color:var(--on-lime)}.tag.warn{background:var(--warn);color:var(--on-warn)}.tag.bad{background:var(--bad);color:var(--on-bad)}

/* Gaiolas, tabelas e o resto */
.card .cnt{font-size:16px;color:var(--muted)}
.card .cnt b{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-right:2px}
.card details{font-size:14px}
.card summary{cursor:pointer;font-weight:600}
.card ul.pl{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:3px;font-size:14px}
.card ul.pl .mono{font-size:13px}
.canais{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:1px 8px;border-radius:3px;border:1px solid var(--line2)}
.msgs{display:grid;gap:0;max-width:720px}
.msgs .m{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.addrow{display:flex;gap:8px;flex-wrap:wrap;max-width:720px}
.addrow input{flex:1 1 240px;width:auto}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1 1 220px;width:auto}
.tools select{width:auto}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lbl);background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:15px}
th{font-size:13px;font-weight:700;text-align:left;color:var(--muted);padding:11px 14px 9px;white-space:nowrap;border-bottom:2px solid var(--ink)}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
td.m{font-family:var(--mono);font-size:14px;white-space:nowrap}
.empty{color:var(--muted);padding:18px}
.st{font-size:13px;font-weight:700;padding:1px 7px;border-radius:3px;white-space:nowrap;color:var(--muted)}
.st.s1{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.st.s2{background:var(--lime);color:var(--on-lime)}
.st.low{background:var(--warn);color:var(--on-warn)}
.st.zero{background:var(--bad);color:var(--on-bad)}
textarea.csv{min-height:140px;font:14px var(--mono);display:block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lbl);overflow:hidden;margin-bottom:18px}
.tile{padding:12px 16px 14px;display:grid;gap:2px;align-content:start;box-shadow:-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.tile .sub{font-weight:400}
.tile .n{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile .n.sm{font-size:24px}
.tile .x{font-size:13px;color:var(--muted)}
.alert{background:var(--warn);color:var(--on-warn);padding:11px 14px;border-radius:var(--r-ctl);margin-bottom:14px;font-weight:600}
.okbox{background:var(--lime);color:var(--on-lime);padding:11px 14px;border-radius:var(--r-ctl);margin-bottom:14px}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-ctl);padding:12px 14px;margin-bottom:16px}
.rom{border:2.5px solid var(--ink);border-radius:var(--r-lbl);margin:0 0 16px;background:var(--card);overflow:hidden}
.rom>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:2.5px solid var(--ink)}
.rom h4{font-weight:800;font-size:20px;letter-spacing:-.01em}
.rom header span{font-size:14px;color:var(--muted)}
.rom .tbl-wrap{border:0;border-radius:0}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;padding:30px 16px 14px}
.sign span{border-top:1.5px solid var(--ink);padding-top:4px;font-size:13px;color:var(--muted)}
.hist{display:grid;gap:0;margin-bottom:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lbl);overflow:hidden}
.hist:has(.void){border:0;background:transparent}
.hist .h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.hist .h:first-child{border-top:0}
.hist .h.sel{box-shadow:inset 4px 0 0 var(--ink)}
.hist .h .d{color:var(--muted);font-size:14px;margin-left:10px}
.note{background:var(--card);border-left:4px solid var(--ink);padding:12px 16px;margin-bottom:20px;max-width:80ch}
.sec{margin:26px 0 10px;font-size:17px;font-weight:800;color:var(--ink)}
.cn .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.cn h3{font-size:18px}
.cn p{font-size:14px;color:var(--muted)}
.stp{font-size:13px;font-weight:700;padding:1px 7px;border-radius:3px;box-shadow:inset 0 0 0 1.5px var(--line2);white-space:nowrap;color:var(--muted)}
.stp.on{background:var(--lime);color:var(--on-lime);box-shadow:none}
.interest{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.interest input{width:18px;height:18px;accent-color:var(--ink)}
.role{font-size:14px}
.role.admin{font-weight:700}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:760px}
.formcard{max-width:820px}

/* Painel de TV: tela escura, lida de longe */
.tv{position:fixed;inset:0;z-index:60;background:#000;color:#F4F4F1;overflow:auto;display:grid;grid-template-rows:auto 1fr auto;font-family:var(--font)}
.tv-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 32px;border-bottom:2px solid #F4F4F1}
.tv-top h2{font-size:clamp(24px,3.4vw,42px)}
.tv-top .td{color:#A9AAA3;font-size:18px}
.tv-top .clock{font-weight:800;font-size:clamp(28px,4vw,52px);letter-spacing:-.02em}
.tv-top button{background:transparent;border:1.5px solid #5C5E57;color:#F4F4F1;border-radius:6px;padding:7px 12px}
.tv-body{padding:28px 32px;display:grid;gap:28px;align-content:start}
.tv-total .n{font-weight:800;font-size:clamp(64px,11vw,160px);line-height:.9;letter-spacing:-.04em}
.tv-total .n small{font-size:.32em;color:#A9AAA3;letter-spacing:-.01em;font-weight:600}
.tv-total p{font-size:22px;color:#A9AAA3;margin-top:10px}
.tv .meter i{background:#2D2E2A}.tv .meter i.e1{background:#6B6D66}.tv .meter i.e2{background:#CCFF00}
.tv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

<script>
(function(){
'use strict';
var KEY='expedicao.web.v1',UKEY='expedicao.users.v1',SKEY='expedicao.sessao.v1';
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(iso){var p=String(iso).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso;}
function fmtTime(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}

/* ---------- Contas e senhas ---------- */
var PERFIS={admin:'Administrador',escritorio:'Escritório',galpao:'Galpão'};
var PERM={admin:['bip','gaiolas','pedidos','etq','fechar','hist','dev','est','vendas','int','users','conta'],escritorio:['bip','pedidos','etq','vendas','conta'],galpao:['bip','gaiolas','dev','est','conta']};
var memSess=null,users=[],me=null,fails=0,lockUntil=0;
function loadUsers(){try{var t=localStorage.getItem(UKEY);if(t){var a=JSON.parse(t);if(Array.isArray(a))return a;}}catch(e){}return [];}
function saveUsers(){try{localStorage.setItem(UKEY,JSON.stringify(users));}catch(e){}}
function sessGet(){try{return sessionStorage.getItem(SKEY)||memSess;}catch(e){return memSess;}}
function sessSet(v){memSess=v;try{if(v)sessionStorage.setItem(SKEY,v);else sessionStorage.removeItem(SKEY);}catch(e){}}
function b64e(u8){var s='';for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function newSalt(){var u=new Uint8Array(16);crypto.getRandomValues(u);return b64e(u);}
function hashPw(pw,salt){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64d(salt),iterations:120000,hash:'SHA-256'},k,256);
  }).then(function(bits){return b64e(new Uint8Array(bits));});
}
function makeUser(nome,login,pw,perfil){
  var salt=newSalt();
  return hashPw(pw,salt).then(function(h){return {id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36),nome:nome,login:login,perfil:perfil,salt:salt,hash:h,criado:Date.now()};});
}
function validLogin(l){return /^[a-z0-9._-]{3,24}$/.test(l);}
function initials(n){var p=String(n).trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}
function allowed(v){return me&&PERM[me.perfil].indexOf(v)>=0;}
function stage(){return me&&me.perfil==='escritorio'?1:me&&me.perfil==='galpao'?2:S.stage;}

/* ---------- Canais, estado ---------- */
var RULES=[
  {re:/^BR\d{12}/,canal:'Shopee',desc:'BR + 12 dígitos'},
  {re:/^TBA\d+/,canal:'Amazon',desc:'TBA + dígitos'},
  {re:/^[A-Z]{2}\d{9}BR$/,canal:'Loja própria',desc:'Rastreio dos Correios (2 letras + 9 dígitos + BR)'},
  {re:/^\d{11}$/,canal:'Mercado Livre',desc:'11 dígitos'}
];
function detect(code){for(var i=0;i<RULES.length;i++){if(RULES[i].re.test(code))return RULES[i].canal;}return '';}
var COLETA_PADRAO={'Mercado Livre':'ML Coleta','Shopee':'Shopee Xpress','Amazon':'Amazon DBA','Loja própria':'Correios'};
var CANAIS=['Mercado Livre','Shopee','Amazon','Loja própria'];
var MOTIVOS=['Arrependimento','Produto diferente do anúncio','Avariado no transporte','Defeito','Item faltando','Envio trocado','Atraso na entrega','Outro'];
var CONDS=[['novo','Novo, lacrado'],['avariado','Avariado'],['defeito','Com defeito'],['incompleto','Incompleto']];
var DESTS=[['estoque','Voltar ao estoque'],['descarte','Descartar'],['fornecedor','Enviar ao fornecedor'],['analise','Em análise']];
var MOVT=[['entrada','Entrada'],['venda','Venda'],['devolucao','Devolução'],['ajuste','Ajuste']];
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seed(){
  var r=mulberry(7),now=Date.now();
  function pick(a){return a[Math.floor(r()*a.length)];}
  function dg(n){var s='';for(var i=0;i<n;i++)s+=Math.floor(r()*10);return s;}
  var prods=['Vaso de cerâmica 25 cm','Quadro decorativo 40x60','Manta de tricô cinza','Almofada de linho 45x45','Vela aromática lavanda','Cesto organizador G','Espelho redondo 50 cm','Porta-retrato de madeira','Bandeja de bambu','Tapete de juta 120 cm'];
  var mix=[['Mercado Livre',.42],['Shopee',.30],['Amazon',.16],['Loja própria',.12]];
  var orders=[];
  for(var i=0;i<48;i++){
    var x=r(),acc=0,canal='Loja própria';
    for(var k=0;k<mix.length;k++){acc+=mix[k][1];if(x<acc){canal=mix[k][0];break;}}
    var code=canal==='Mercado Livre'?'4'+dg(10):canal==='Shopee'?'BR'+dg(12):canal==='Amazon'?'TBA'+dg(12):pick(['PB','NL','QS'])+dg(9)+'BR';
    var coleta=canal==='Mercado Livre'?(r()<.4?'ML Flex':'ML Coleta'):COLETA_PADRAO[canal];
    var etapa=i<14?2:i<30?1:0;
    orders.push({id:'P'+(5000+i),canal:canal,produto:pick(prods),codigo:code,coleta:coleta,etapa:etapa,t1:etapa>=1?now-(60-i)*60000:0,t2:etapa===2?now-(40-i)*60000:0});
  }
  orders[41].codigo=orders[40].codigo;orders[41].canal=orders[40].canal;orders[41].coleta=orders[40].coleta;
  var precos=[89.9,149.9,119.9,69.9,39.9,79.9,179.9,54.9,64.9,229.9];
  var products=prods.map(function(n,i){return {sku:'DC-'+String(i+1).padStart(3,'0'),nome:n,ean:'789'+dg(10),preco:precos[i],custo:Math.round(precos[i]*(0.38+r()*.12)*100)/100,minimo:6+Math.floor(r()*6),saldo:8+Math.floor(r()*40)};});
  products[2].saldo=3;products[6].saldo=0;
  var sales=[],movs=[],cnt=0,base=new Date();base.setHours(0,0,0,0);
  for(var d=13;d>=0;d--){
    var n=d===0?3:4+Math.floor(r()*6);
    for(var j=0;j<n;j++){
      var xx=r(),ac2=0,cn='Loja própria';
      for(var kk=0;kk<mix.length;kk++){ac2+=mix[kk][1];if(xx<ac2){cn=mix[kk][0];break;}}
      var pp=pick(products),q=1+(r()<.25?1:0);
      var ts=d===0?now-Math.floor(r()*6*3600000):base.getTime()-d*86400000+(8+r()*9)*3600000;
      sales.push({id:'V'+(1000+cnt),ts:ts,canal:cn,sku:pp.sku,produto:pp.nome,qtd:q,valor:Math.round(pp.preco*q*100)/100,pedido:'P'+(4000+cnt),op:'Exemplo'});cnt++;
    }
  }
  sales.sort(function(a,b){return b.ts-a.ts;});
  sales.slice(0,8).forEach(function(s){movs.push({ts:s.ts,tipo:'venda',sku:s.sku,qtd:-s.qtd,ref:s.pedido,op:'Exemplo'});});
  [0,3,5].forEach(function(i,k){movs.push({ts:now-(k+1)*86400000*1.5,tipo:'entrada',sku:products[i].sku,qtd:20,ref:'NF 1234'+k,op:'Exemplo'});});
  movs.sort(function(a,b){return b.ts-a.ts;});
  var cds=['novo','avariado','defeito','novo','incompleto','avariado'],dts=['estoque','descarte','fornecedor','estoque','analise','analise'];
  var returns=[0,1,2,3,4,5].map(function(i){
    var o=orders[i*3],p=products.filter(function(x){return x.nome===o.produto;})[0];
    return {id:'D'+(7100+i),ts:now-(i+1)*86400000*.7,pedido:o.id,codigo:o.codigo,canal:o.canal,sku:p.sku,produto:o.produto,motivo:MOTIVOS[[0,2,3,1,4,5][i]],condicao:cds[i],destino:dts[i],obs:'',valor:p.preco,status:dts[i]==='analise'?'Em análise':'Concluída',op:'Exemplo'};
  });
  return {orders:orders,products:products,sales:sales,returns:returns,movs:movs,scans:[],history:[],stage:1,sound:true,sample:true,interest:{},
    messages:['Coleta do Mercado Livre às 15h: gaiolas prontas até 14h30','Confira o produto antes de lacrar o pacote','Shopee Xpress passa às 16h30']};
}
function load(){try{var t=localStorage.getItem(KEY);if(t){var o=JSON.parse(t);if(o&&Array.isArray(o.orders))return o;}}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load()||seed();
S.interest=S.interest||{};S.history=S.history||[];S.scans=S.scans||[];S.messages=S.messages||[];
if(!S.products){var sd0=seed(),ex0=S.sample!==false;S.products=ex0?sd0.products:[];S.sales=ex0?sd0.sales:[];S.returns=ex0?sd0.returns:[];S.movs=ex0?sd0.movs:[];}
S.sales=S.sales||[];S.returns=S.returns||[];S.movs=S.movs||[];
var ui={eq:'',ef:'new',esel:{},view:'bip',sub:{},res:null,q:'',st:'',histSel:null,confirm:null,userAct:null,tvIdx:0,tvOpen:false,lastClosed:null};
function newDev(){return {motivo:MOTIVOS[0],condicao:'novo',destino:'estoque',canal:'Mercado Livre',pedido:'',codigo:'',sku:'',livre:'',obs:''};}

freshModels();

function counts(){var t=S.orders.length,i=0,c=0;S.orders.forEach(function(o){if(o.etapa>=1)i++;if(o.etapa===2)c++;});return {t:t,imp:i,conf:c,falta:t-c};}
function groups(){
  var m={},out=[];
  S.orders.forEach(function(o){var g=m[o.coleta];if(!g){g=m[o.coleta]={coleta:o.coleta,canais:{},total:0,imp:0,conf:0,list:[]};out.push(g);}g.canais[o.canal]=1;g.total++;if(o.etapa>=1)g.imp++;if(o.etapa===2)g.conf++;g.list.push(o);});
  return out.sort(function(a,b){return b.total-a.total;});
}
function pct(a,b){return b?Math.round(a/b*100):0;}
function meter(list,cls){
  var n=list.length;if(!n)return '';
  var e=list.map(function(o){return o.etapa;}).sort(function(a,b){return b-a;}),max=140,out='',conf=e.filter(function(x){return x===2;}).length;
  if(n<=max)out=e.map(function(x){return '<i class="e'+x+'"></i>';}).join('');
  else for(var b=0;b<max;b++){var x=e[Math.floor((b+.5)*n/max)];out+='<i class="e'+x+'"></i>';}
  return '<div class="meter '+(cls||'')+'" role="img" aria-label="'+conf+' de '+n+' pedidos conferidos">'+out+'</div>';
}
function bar(a,b){return '<div class="bar2" role="img" aria-label="'+pct(a,b)+'% concluído"><i style="width:'+pct(a,b)+'%"></i></div>';}

function num(s){var v=parseFloat(String(s==null?'':s).replace(',','.'));return isNaN(v)?NaN:v;}
function prodBySku(s){return S.products.filter(function(p){return p.sku===s;})[0];}
function prodByName(n){return S.products.filter(function(p){return p.nome===n;})[0];}

/* ---------- Som, aviso, cópia ---------- */
var ac=null;
function beep(kind){
  if(!S.sound)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var seq=kind==='ok'?[[1040,.09,'sine'],[1320,.09,'sine']]:kind==='warn'?[[520,.13,'square'],[520,.13,'square']]:[[150,.4,'sawtooth']];
    var t=ac.currentTime;
    seq.forEach(function(s){var o=ac.createOscillator(),g=ac.createGain();o.type=s[2];o.frequency.value=s[0];g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+s[1]);t+=s[1]+.05;});
  }catch(e){}
}
function flash(kind){var f=$('#flash');f.className='flash '+kind;void f.offsetWidth;f.className='flash '+kind+' go';}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true;},2600);}
function copy(text){
  function fb(){var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}document.body.removeChild(ta);toast(ok?'Copiado':'Não foi possível copiar. Selecione o texto e copie.');}
  try{navigator.clipboard.writeText(text).then(function(){toast('Copiado');},fb);}catch(e){fb();}
}

/* ---------- Bipagem ---------- */
function scan(raw){
  var code=String(raw||'').trim().toUpperCase();
  if(!code)return;
  var st=stage(),op=me?me.nome:'',now=Date.now(),res,kind;
  var matches=S.orders.filter(function(o){return o.codigo===code;});
  if(!matches.length){
    var c=detect(code);kind='bad';
    res={tone:'bad',title:'Não encontrado',big:'Esse pacote não está nos pedidos de hoje',lines:[c?'O código tem o formato de '+c+'.':'O código não tem formato de nenhum canal.','Separe o pacote e avise o responsável.']};
    if(ELX[normC(code)])res.lines.unshift('Existe uma etiqueta importada com esse código, mas o pedido não está na lista de hoje.');
  }else{
    var target=matches.filter(function(o){return o.etapa===st-1;})[0];
    if(target){
      target.etapa=st;if(st===1){target.t1=now;}else{target.t2=now;}
      var idx=matches.indexOf(target)+1;kind='ok';
      res=st===1
        ?{tone:'ok',title:'Impresso',big:'Pode seguir para o galpão',lines:['Pedido '+target.id+': '+target.produto,target.canal+', vai para a gaiola '+target.coleta+'.']}
        :{tone:'ok',title:'Conferido',big:'Gaiola '+target.coleta,lines:['Pedido '+target.id+': '+target.produto,'Canal '+target.canal+'.']};
      if(matches.length>1)res.lines.push('Esse código aparece em '+matches.length+' pedidos. Este é o '+idx+'º.');
      if(st===2){if(target.eo&&target.eo.st==='impressa'){target.ec=now;res.lines.push('Etiqueta de envio conferida: é a do pedido certo.');}else if(S.eoUsed){res.lines.push('Atenção: a etiqueta de envio deste pedido não foi impressa pelo Skannio.');}}
    }else if(st===2&&matches.every(function(o){return o.etapa===0;})){
      kind='warn';res={tone:'warn',title:'Não impresso',big:'Volte para a etapa 1',lines:['Pedido '+matches[0].id+': '+matches[0].produto,'A etiqueta desse pedido ainda não foi bipada na impressão.']};
    }else{
      var m=matches.filter(function(o){return o.etapa>=st;})[0]||matches[0];
      kind='warn';res={tone:'warn',title:'Já bipado',big:'Pacote repetido',lines:['Pedido '+m.id+': '+m.produto,'Bipado às '+fmtTime(st===1?m.t1:m.t2)+', gaiola '+m.coleta+'.']};
    }
  }
  S.scans.unshift({ts:now,code:code,res:kind,stage:st,op:op,pedido:matches[0]?matches[0].id:''});
  S.scans=S.scans.slice(0,60);
  ui.res=res;save();beep(kind);flash(kind);updateBip();renderTV();
}

function parseCSV(t){
  var lines=t.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  if(!lines.length)return {err:'Cole ao menos uma linha de pedido.'};
  var sep=lines[0].indexOf(';')>=0?';':',';
  if(/pedido/i.test(lines[0]))lines.shift();
  var ok=[],skip=0,have={};S.orders.forEach(function(o){have[o.id]=1;});
  lines.forEach(function(l){
    var p=l.split(sep).map(function(s){return s.trim();});
    var code=(p[3]||'').toUpperCase();
    if(!p[0]||!code||have[p[0]]){skip++;return;}
    var canal=p[1]||detect(code)||'Outro';
    ok.push({id:p[0],canal:canal,produto:p[2]||'Sem descrição',codigo:code,coleta:p[4]||COLETA_PADRAO[canal]||canal,etapa:0,t1:0,t2:0});
    have[p[0]]=1;
  });
  return {ok:ok,skip:skip};
}

var C128=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];
function c128(txt){
  txt=String(txt||'');var v=[104],sum=104,i;
  for(i=0;i<txt.length;i++){var c=txt.charCodeAt(i)-32;if(c<0||c>94)c=0;v.push(c);sum+=c*(i+1);}
  v.push(sum%103);v.push(106);
  var x=10,d='';
  v.forEach(function(k){var pt=C128[k];for(var j=0;j<pt.length;j++){var w=+pt.charAt(j);if(j%2===0)d+='M'+x+' 0h'+w+'v1h-'+w+'z';x+=w;}});
  return '<svg viewBox="0 0 '+(x+10)+' 1" preserveAspectRatio="none" shape-rendering="crispEdges" role="img" aria-label="Código de barras '+esc(txt)+'"><path fill="#000" d="'+d+'"/></svg>';
}

/* ---------- Etiquetas oficiais: importação de PDF/ZPL, pareamento, impressão e conferência ---------- */
/* Portado do módulo de etiquetas (fontes, fila, conferência). Roda no navegador: as etiquetas ficam só neste aparelho (IndexedDB) e nada é enviado. */
var ELB=[],ELX={},elbReady=false;
function normC(c){return String(c==null?'':c).toUpperCase().replace(/[\s.\-]/g,'');}
var CODE_RE=[/\b[A-Z]{2}\d{9}[A-Z]{2}\b/g,/\bBR\d{12,14}[A-Z]?\b/g,/\bTBA\d{9,}\b/g,/\b\d{11}\b/g,/\b\d{14,16}\b/g,/\b(?=[A-Z0-9]*\d)[A-Z0-9]{8,24}\b/g];
function extractCodes(text){
  var t=String(text).toUpperCase().replace(/\s+/g,' '),seen={},out=[];
  CODE_RE.forEach(function(re){(t.match(re)||[]).forEach(function(c){if(!seen[c]&&out.length<80){seen[c]=1;out.push(c);}});});
  return out;
}
function elbIndex(){ELX={};ELB.forEach(function(e){e.codes.forEach(function(c){(ELX[c]=ELX[c]||[]).push(e);});});}
function elbLoad(){
  if(elbReady)return Promise.resolve();
  return fotoDB().then(function(db){return new Promise(function(res){
    var rq=db.transaction('etiquetas').objectStore('etiquetas').getAll();
    rq.onsuccess=function(){ELB=rq.result||[];elbIndex();elbReady=true;res();};
    rq.onerror=function(){elbReady=true;res();};
  });}).catch(function(){elbReady=true;});
}
function elbPut(list){
  return fotoDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('etiquetas','readwrite'),st=tx.objectStore('etiquetas');list.forEach(function(x){st.put(x);});tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}).catch(function(){});
}
function elbDel(ids){
  return fotoDB().then(function(db){return new Promise(function(res){var tx=db.transaction('etiquetas','readwrite'),st=tx.objectStore('etiquetas');if(ids==='all')st.clear();else ids.forEach(function(i){st.delete(i);});tx.oncomplete=res;tx.onerror=res;});}).catch(function(){});
}
/* Fontes em ordem de prioridade. O app pede "etiqueta do pedido X"; cada fonte sabe buscar. As outras entram no mesmo contrato. */
var ESRC=[
  {id:'arq',nome:'Arquivo (PDF/ZPL)',ver:'v1.0',on:true,d:'O lojista baixa as etiquetas do marketplace e importa aqui. O app lê o código de cada etiqueta e casa com o pedido. Funciona com qualquer ERP, ou sem ERP.',get:function(o){var ids=[normC(o.codigo),normC(o.id)],i,h;for(i=0;i<ids.length;i++){h=ELX[ids[i]];if(h&&h.length)return {e:h[0],code:ids[i],amb:h.length>1};}return null;}},
  {id:'bling',nome:'Bling',ver:'v1.0',on:false,d:'O servidor busca a etiqueta de envio pela API, com a chave OAuth guardada fora do app. Falta validar se a API devolve a etiqueta de Mercado Livre e Shopee ou só de transportadoras.'},
  {id:'tiny',nome:'Tiny / Olist',ver:'v1.1',on:false,d:'Mais uma fonte no mesmo contrato, sem mexer na bipagem nem na fila.'},
  {id:'ml',nome:'Mercado Livre direto',ver:'v2.0',on:false,d:'API de envios do Mercado Livre. Exige credenciamento como parceiro, que demora; por isso começa antes.'},
  {id:'sp',nome:'Shopee direto',ver:'v2.0',on:false,d:'API de logística da Shopee. Também exige credenciamento.'}
];
function eoResolve(o){
  var tried=[],i,s,r;
  for(i=0;i<ESRC.length;i++){
    s=ESRC[i];if(!s.on)continue;
    try{r=s.get(o);}catch(x){tried.push({s:s.nome,r:'erro: '+x.message});continue;}
    if(r)return {m:r,src:s.nome,tried:tried};
    tried.push({s:s.nome,r:'não encontrada'});
  }
  return {m:null,tried:tried};
}
/* Situação de cada pedido: pro (pronta), imp (impressa), fal (falhou), sem (sem etiqueta). */
function eoStatus(o){
  var r=eoResolve(o),eo=o.eo;
  if(eo&&eo.st==='impressa')return {k:'imp',r:r,eo:eo};
  if(!r.m)return {k:'sem',r:r,eo:eo};
  if(eo&&eo.st==='falhou')return {k:'fal',r:r,eo:eo};
  return {k:'pro',r:r,eo:eo};
}
function eoCounts(){
  var c={t:S.orders.length,pro:0,imp:0,fal:0,sem:0};
  S.orders.forEach(function(o){c[eoStatus(o).k]++;});

}
function eoList(){
  var q=(ui.oq||'').toLowerCase(),f=ui.of;
  return S.orders.map(function(o){return {o:o,s:eoStatus(o)};}).filter(function(x){
    var k=x.s.k;
    if(f==='pro'&&k!=='pro'&&k!=='fal')return false;
    if(f==='imp'&&k!=='imp')return false;
    if(f==='sem'&&k!=='sem')return false;
    return !q||(x.o.id+' '+x.o.codigo+' '+x.o.produto+' '+x.o.canal+' '+x.o.coleta).toLowerCase().indexOf(q)>=0;
  });

    .filter(function(x){return x.s.k==='pro'||x.s.k==='fal';})
    .sort(function(a,b){return a.o.coleta<b.o.coleta?-1:a.o.coleta>b.o.coleta?1:(a.o.id<b.o.id?-1:1);});

var PDFJS_V='3.11.174';
function pdfjsLoad(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);

    var s=document.createElement('script'),base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/'+PDFJS_V+'/';

    s.onerror=function(){rej(new Error('Não consegui carregar o leitor de PDF. Verifique a conexão.'));};
    document.head.appendChild(s);
  });
}
function bcRead(canvas){
  if(!window.BarcodeDetector)return Promise.resolve([]);
  try{return new window.BarcodeDetector().detect(canvas).then(function(r){return r.map(function(x){return String(x.rawValue||'');});}).catch(function(){return [];});}catch(e){return Promise.resolve([]);}
}
function eoUid(){return 'L'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);}
function readBuf(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=function(){rej(new Error('Não consegui ler o arquivo.'));};r.readAsArrayBuffer(f);});}
function readTxt(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result||''));};r.onerror=function(){rej(new Error('Não consegui ler o arquivo.'));};r.readAsText(f);});}
function eoPdfFile(f,sum,out){
  return readBuf(f).then(function(buf){return pdfjsLoad().then(function(lib){return lib.getDocument({data:new Uint8Array(buf)}).promise;});}).then(function(doc){
    var n=doc.numPages,i=1;
    function next(){
      if(i>n)return Promise.resolve();
      var pn=i++;
      ui.eoBusy=f.name+': página '+pn+' de '+n;var b=$('#eobusy');if(b)b.textContent=ui.eoBusy;
      return doc.getPage(pn).then(function(page){
        return page.getTextContent().then(function(tc){
          var codes=extractCodes(tc.items.map(function(it){return it.str;}).join(' '));
          var v1=page.getViewport({scale:1}),sc=Math.max(1,Math.min(4,1500/Math.max(v1.width,v1.height))),vp=page.getViewport({scale:sc});
          var cv=document.createElement('canvas');cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
          return page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){
            return (codes.length?Promise.resolve([]):bcRead(cv)).then(function(extra){
              extra.forEach(function(c){c=normC(c);if(c&&codes.indexOf(c)<0)codes.push(c);});
              if(!codes.length){sum.nocode++;return;}
              out.push({id:eoUid(),fmt:'pdf',file:f.name,page:pn-1,codes:codes,img:cv.toDataURL('image/png'),ts:Date.now()});
              sum.labels++;
            });
          });
        });
      }).then(next);
    }
    sum.files++;
    return next();
  });
}
function eoZplFile(f,sum,out){
  return readTxt(f).then(function(text){
    var blocks=text.match(/\^XA[\s\S]*?\^XZ/gi)||[];
    if(!blocks.length)throw new Error('Não encontrei etiquetas ZPL (^XA…^XZ) nesse arquivo.');
    sum.files++;
    blocks.forEach(function(bl,i){
      var fields=(bl.match(/\^FD[^\^]*\^FS/g)||[]).map(function(x){return x.slice(3,-3);}).join(' ');
      var codes=extractCodes(fields);
      if(!codes.length){sum.nocode++;return;}
      out.push({id:eoUid(),fmt:'zpl',file:f.name,page:i,codes:codes,zpl:bl,ts:Date.now()});
      sum.labels++;
    });
  });
}
function eoImport(files){
  var list=Array.prototype.slice.call(files||[]);if(!list.length)return;
  var sum={files:0,labels:0,nocode:0,errors:[]},out=[],names={};
  list.forEach(function(f){names[f.name]=1;});
  ui.eoBusy='Lendo arquivos…';var b=$('#eobusy');if(b)b.textContent=ui.eoBusy;
  var chain=elbLoad();
  list.forEach(function(f){
    chain=chain.then(function(){
      var ext=(f.name.split('.').pop()||'').toLowerCase();
      if(ext==='pdf')return eoPdfFile(f,sum,out);
      if(ext==='zpl'||ext==='txt')return eoZplFile(f,sum,out);
      throw new Error('Formato não aceito. Use PDF, ZPL ou TXT.');
    }).catch(function(err){sum.errors.push({file:f.name,error:err&&err.message?err.message:'Erro ao ler.'});});
  });
  chain.then(function(){
    var okN={};out.forEach(function(n){okN[n.file]=1;});
    var drop=ELB.filter(function(e){return okN[e.file];}).map(function(e){return e.id;});
    ELB=ELB.filter(function(e){return !okN[e.file];});
    return elbDel(drop).then(function(){return elbPut(out);});
  }).then(function(){
    ELB=ELB.concat(out);elbIndex();
    if(out.length)S.eoUsed=true;
    ui.eoSum=sum;ui.eoBusy='';save();
    if(sum.labels)toast(sum.labels+(sum.labels===1?' etiqueta importada.':' etiquetas importadas.'));
    if(ui.view==='etq')render();
  });
}
function eoSample(){

function startOfDay(d){var x=new Date(d);x.setHours(0,0,0,0);return x.getTime();}
function dayKey(d){var x=new Date(d);return x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();}
function salesSince(days){var from=startOfDay(Date.now())-(days-1)*864e5;return S.sales.filter(function(s){return s.ts>=from;});}
function sumV(list){return list.reduce(function(a,s){return a+s.valor;},0);}
function niceStep(v){var p=Math.pow(10,Math.floor(Math.log(v)/Math.LN10)),n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function kfmt(v){return v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(v);}
function chartDias(){
  var base=new Date();base.setHours(0,0,0,0);var days=[],m={};
  for(var i=13;i>=0;i--){var d=new Date(base);d.setDate(d.getDate()-i);var o={k:dayKey(d),dd:d.getDate(),t:0};days.push(o);m[o.k]=o;}
  S.sales.forEach(function(s){var o=m[dayKey(s.ts)];if(o)o.t+=s.valor;});
  var max=0;days.forEach(function(o){if(o.t>max)max=o.t;});
  if(!max)return '<p class="empty">Sem vendas nos últimos 14 dias.</p>';
  var step=niceStep(max/3),n=Math.ceil(max/step),top=n*step,W=640,H=240,L=58,R=8,T=24,B=28,pw=W-L-R,ph=H-T-B,bw=pw/14,g='',bars='';
  for(var k=0;k<=n;k++){var v=k*step,y=T+ph-(v/top)*ph;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(v)+'</text>';}
  days.forEach(function(o,i){var h=(o.t/top)*ph,x=L+i*bw+bw*.19,w=bw*.62,y=T+ph-h,td=i===13;bars+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,1)+'" rx="2" style="fill:'+(td?'var(--lime)':'var(--line2)')+(td?';stroke:var(--edge);stroke-width:1.5':'')+'"/><text x="'+(x+w/2)+'" y="'+(H-10)+'" text-anchor="middle">'+o.dd+'</text>';});
  var last=days[13];
  if(last.t>0)bars+='<text x="'+(W-R)+'" y="'+(T+ph-(last.t/top)*ph-6)+'" text-anchor="end" style="fill:var(--ink);font-weight:600">'+brl(last.t)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Faturamento por dia nos últimos 14 dias">'+g+bars+'</svg>';
}
function countBy(list,fn){var m={};list.forEach(function(x){var k=fn(x);m[k]=(m[k]||0)+1;});return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];});}
function barsHTML(pairs,fmt){

var fotoCache={},memF={},idb=null;
function fotoDB(){
  return new Promise(function(res,rej){
    if(idb)return res(idb);
    try{var rq=indexedDB.open('bipou-fotos',2);rq.onupgradeneeded=function(){var d=rq.result;if(!d.objectStoreNames.contains('fotos'))d.createObjectStore('fotos',{keyPath:'id'});if(!d.objectStoreNames.contains('etiquetas'))d.createObjectStore('etiquetas',{keyPath:'id'});};rq.onsuccess=function(){idb=rq.result;res(idb);};rq.onerror=function(){rej(rq.error);};}catch(e){rej(e);}
  });
}
function fotoPut(id,url){
  fotoCache[id]=url;
  return fotoDB().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('fotos','readwrite');tx.objectStore('fotos').put({id:id,url:url});tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}).catch(function(){memF[id]=url;});
}
function fotoGet(id){
  if(fotoCache[id])return Promise.resolve(fotoCache[id]);
  return fotoDB().then(function(db){return new Promise(function(res){var rq=db.transaction('fotos').objectStore('fotos').get(id);rq.onsuccess=function(){var u=rq.result?rq.result.url:(memF[id]||'');if(u)fotoCache[id]=u;res(u);};rq.onerror=function(){res(memF[id]||'');};});}).catch(function(){return memF[id]||'';});
}
function fotoDelId(id){delete fotoCache[id];delete memF[id];fotoDB().then(function(db){db.transaction('fotos','readwrite').objectStore('fotos').delete(id);}).catch(function(){});}
function shrink(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',0.72));};
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'));};
    im.src=u;
  });
}
function addFotos(files){

  if(!list.length){toast('Limite de 4 fotos por devolução.');return;}
  Promise.all(list.map(function(f){return shrink(f).then(function(url){var id='F'+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36);return fotoPut(id,url).then(function(){return id;});});}))
    .then(function(ids){ids.forEach(function(i){ui.devFotos.push(i);});render();})
    .catch(function(){toast('Não foi possível ler essa imagem. Tente outra foto.');});

function showErr(id,msg){var e=$(id);if(!e)return;e.textContent=msg;e.hidden=!msg;}
/* Esteira do login: os pacotes andam para a direita; ao cruzar o feixe (x=BX) a etiqueta fica lime.
   Duas camadas iguais e sincronizadas, cortadas uma de cada lado do feixe. */
function esteiraSVG(){
  var AX=260,BX=AX+294,P=1200,H=236;
  var boxes=[[10,96,70],[150,70,50],[262,124,98],[432,84,62],[560,62,46],[668,112,84],[832,90,68],[972,72,54],[1084,98,78]];
  function layer(on){
    var g='';
    for(var rep=0;rep<3;rep++)boxes.forEach(function(b,i){
      var x=b[0]+rep*P,w=b[1],h=b[2],y=H-h,lw=Math.round(Math.min(44,w*.46)),lh=Math.round(Math.min(28,h*.42)),lx=Math.round(x+w/2-lw/2+(i%2?7:-7)),ly=Math.round(y+h*.4);
      g+='<rect class="bx" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3"/>'
       +'<path class="sm" d="M'+(x+2)+' '+(y+12)+'H'+(x+w-2)+'"/>'
       +'<rect class="tp" x="'+(x+w/2-6)+'" y="'+(y+1.5)+'" width="12" height="'+Math.round(h*.3)+'"/>'
       +'<rect class="lb'+(on?' on':'')+'" x="'+lx+'" y="'+ly+'" width="'+lw+'" height="'+lh+'" rx="2"/>';
      for(var k=0;k<6;k++)g+='<path class="br" d="M'+(lx+5+k*(lw-10)/5).toFixed(1)+' '+(ly+5)+'V'+(ly+lh-5)+'" stroke-width="'+(k%3===1?2.6:1.3)+'"/>';
    });
    return g;
  }
  var rol='',legs='';
  for(var r=24;r<2400;r+=48)rol+='<circle class="rol" cx="'+r+'" cy="262" r="10"/>';
  for(var l=60;l<2400;l+=300)legs+='<rect class="leg" x="'+l+'" y="272" width="8" height="27"/>';
  var ast=astro('normal','full','none').replace('<svg class="astro"','<svg class="astro" x="'+AX+'" y="8" width="240" height="223"');
  return '<svg viewBox="0 0 2400 300" preserveAspectRatio="xMinYMax slice" xmlns="http://www.w3.org/2000/svg">'
   +'<defs><clipPath id="cpA"><rect x="-10" y="0" width="'+(BX+10)+'" height="300"/></clipPath><clipPath id="cpB"><rect x="'+BX+'" y="0" width="2400" height="300"/></clipPath></defs>'
   +'<path class="floor" d="M0 299H2400"/>'+legs+rol
   +'<rect class="belt" x="0" y="'+H+'" width="2400" height="16"/><path class="dash" d="M0 '+(H+8)+'H2400"/>'
   +'<g clip-path="url(#cpA)"><g class="run">'+layer(false)+'</g></g>'
   +'<g clip-path="url(#cpB)"><g class="run">'+layer(true)+'</g></g>'
   +'<path class="beam" d="M'+(AX+192)+' 140L'+BX+' 128V'+H+'Z"/><path class="scanl" d="M'+BX+' 128V'+H+'"/>'
   +ast+'</svg>';
}
function paintMascot(){
  var e=$('#esteira'),b=$('#mk2');
  if(e&&!e.firstChild)e.innerHTML=esteiraSVG();
  if(b&&!b.firstChild)b.innerHTML=astro('normal','head');
}

function doLogin(){
  var now=Date.now();
  if(now<lockUntil){showErr('#l_err','Muitas tentativas. Aguarde '+Math.ceil((lockUntil-now)/1000)+' segundos.');return;}
  var l=$('#l_user').value.trim().toLowerCase(),pw=$('#l_pw').value;
  if(!l||!pw){showErr('#l_err','Informe usuário e senha.');return;}
  $('#l_btn').disabled=true;
  var u=users.filter(function(x){return x.login===l;})[0];
  var p=u?hashPw(pw,u.salt):hashPw(pw,newSalt()).then(function(){return null;});
  p.then(function(h){
    $('#l_btn').disabled=false;
    if(u&&h===u.hash){fails=0;enterApp(u);return;}
    fails++;
    if(fails>=5){lockUntil=Date.now()+30000;fails=0;showErr('#l_err','Muitas tentativas. Aguarde 30 segundos.');}
    else showErr('#l_err','Usuário ou senha incorretos.');
    $('#l_pw').value='';$('#l_pw').focus();
  }).catch(function(){$('#l_btn').disabled=false;showErr('#l_err','Este navegador não permite criar o acesso seguro. Abra o link em outro navegador.');});
}
function doSetup(){

  if(nome.length<2){showErr('#l_err','Informe seu nome.');return;}
  if(!validLogin(l)){showErr('#l_err','Usuário: 3 a 24 caracteres, só letras minúsculas, números, ponto, hífen ou sublinhado.');return;}
  if(pw.length<6){showErr('#l_err','A senha precisa de ao menos 6 caracteres.');return;}
  if(pw!==pw2){showErr('#l_err','As senhas não conferem.');return;}

    ui.res2={tone:'ok',title:'Devolução registrada',big:rt.produto,lines:[lbl(DESTS,rt.destino)+(rt.destino==='estoque'&&rt.sku?'. Saldo +1.':'.')]};
    save();fb('ok');render();return;
  }
  if(id==='msgForm'){var m=$('#msgIn').value.trim();if(m){S.messages.push(m);save();render();renderTV();}return;}
  if(kind==='newuser'&&me.perfil==='admin'){
    var nome=$('#nu_nome').value.trim(),l=$('#nu_login').value.trim().toLowerCase(),pw=$('#nu_pw').value,pf=$('#nu_perfil').value;
    if(nome.length<2){showErr('#nu_err','Informe o nome.');return;}
    if(!validLogin(l)){showErr('#nu_err','Usuário: 3 a 24 caracteres, só letras minúsculas, números, ponto, hífen ou sublinhado.');return;}
    if(users.some(function(u){return u.login===l;})){showErr('#nu_err','Já existe um usuário com esse nome de acesso.');return;}
    if(pw.length<6){showErr('#nu_err','A senha precisa de ao menos 6 caracteres.');return;}
    makeUser(nome,l,pw,pf).then(function(u){users.push(u);saveUsers();ui.sub.users='e';render();toast('Usuário '+l+' criado');});
    return;
  }
  if(kind==='userpw'&&me.perfil==='admin'){
    var uid=f.getAttribute('data-id'),np=$('#npw').value,uu=users.filter(function(x){return x.id===uid;})[0];
    if(!uu)return;
    if(np.length<6){toast('A senha precisa de ao menos 6 caracteres.');return;}
    var salt=newSalt();hashPw(np,salt).then(function(h){uu.salt=salt;uu.hash=h;saveUsers();ui.userAct=null;render();toast('Senha de '+uu.nome+' alterada');});
    return;
  }
  if(kind==='mypw'){
    var old=$('#mp_old').value,n1=$('#mp_new').value,n2=$('#mp_new2').value;
    if(n1.length<6){showErr('#mp_err','A nova senha precisa de ao menos 6 caracteres.');return;}
    if(n1!==n2){showErr('#mp_err','As senhas novas não conferem.');return;}
    hashPw(old,me.salt).then(function(h){
      if(h!==me.hash){showErr('#mp_err','A senha atual está incorreta.');return;}
      var salt=newSalt();
      return hashPw(n1,salt).then(function(h2){me.salt=salt;me.hash=h2;saveUsers();render();toast('Senha alterada');});
    });
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&!$('#fotoModal').hidden){$('#fotoModal').hidden=true;return;}
  if(e.key==='Escape'&&ui.tvOpen){closeTV();return;}
  if(me&&!ui.tvOpen&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    var tg=e.target&&e.target.tagName;
    if(tg!=='INPUT'&&tg!=='TEXTAREA'&&tg!=='SELECT')focusScan();
  }
});
window.addEventListener('storage',function(e){
  if(e.key===UKEY){
    users=loadUsers();
    if(me){var still=users.filter(function(u){return u.id===me.id;})[0];if(!still){logout();return;}me=still;}
    else if($('#login')&&!$('#login').hidden){showLogin();}
    return;
  }
  if(e.key!==KEY||!e.newValue||!me)return;
  try{S=JSON.parse(e.newValue);}catch(x){return;}
  S.products=S.products||[];S.sales=S.sales||[];S.returns=S.returns||[];S.movs=S.movs||[];S.history=S.history||[];S.scans=S.scans||[];S.messages=S.messages||[];S.interest=S.interest||{};
  renderTV();
  var busy=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if(ui.view==='bip')updateBip();else if(['gaiolas','fechar','int','dev','est','vendas'].indexOf(ui.view)>=0&&!ui.confirm&&!busy)render();
});
function net(){var on=navigator.onLine!==false;var el=$('#net');el.className='pill'+(on?'':' off');el.lastChild.textContent=on?'Online':'Sem internet, salvando neste aparelho';}
window.addEventListener('online',net);window.addEventListener('offline',net);
window.addEventListener('hashchange',function(){if(me&&location.hash==='#tv')openTV();});

/* ---------- Início ---------- */
net();
users=loadUsers();
var sid=sessGet(),su=sid?users.filter(function(u){return u.id===sid;})[0]:null;
if(su)enterApp(su);else showLogin();
})();
</script>
